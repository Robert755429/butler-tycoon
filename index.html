<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BUTLER TYCOON</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent}
  body{background:#111;color:white;overflow:hidden}
  #hud{position:fixed;top:0;left:0;right:0;background:#1a1a1a;padding:10px;display:flex;justify-content:space-between;gap:6px;font-size:13px;z-index:10;border-bottom:2px solid #f5c518}
  #hud b{color:#f5c518}
  #bar-wrap{background:#333;height:10px;border-radius:10px;overflow:hidden;margin:6px 10px 0}
  #bar{height:100%;width:0%;background:linear-gradient(90deg,#f5c518,#00ff88);transition:width .3s}
  #game{position:relative;width:100vw;height:calc(100vh - 70px);margin-top:58px;background:#2b2b2b;overflow:hidden}
  .room{position:absolute;border:3px solid #fff;border-radius:12px;padding:10px}
  #room1{left:3%;top:8%;width:43%;height:65%;background:#4a3b2a}
  #room2{right:3%;top:8%;width:43%;height:65%;background:#2a3a4a}
  .room h3{font-size:14px;margin-bottom:6px}
  .room p{font-size:11px;opacity:.8}
  #player{position:absolute;width:42px;height:42px;background:#f5c518;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;z-index:5;transition:left .08s,top .08s;box-shadow:0 0 15px #f5c518}
  .dirt{position:absolute;width:44px;height:44px;background:#5a4a2a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;border:2px dashed #fff;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
  #joy{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:20}
  #joy button{width:58px;height:58px;border-radius:50%;border:none;background:#f5c518;font-size:22px;font-weight:bold}
  #msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#000e;border:2px solid #f5c518;padding:18px;border-radius:14px;text-align:center;display:none;z-index:30;width:85%}
  #shop{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#222;border:1px solid #444;padding:8px 12px;border-radius:20px;font-size:12px;z-index:20}
  #shop button{background:#00ff88;border:none;padding:7px 10px;border-radius:10px;font-weight:bold;margin-left:6px}
</style>
</head>
<body>

<div id="hud">
  <div>💰 <b id="money">0€</b></div>
  <div>⭐ <b id="sodd">0%</b></div>
  <div>📅 Giorno <b id="day">1</b>/30</div>
  <div>⏰ <b id="timer">2:00</b></div>
</div>
<div id="bar-wrap"><div id="bar"></div></div>

<div id="game">
  <div class="room" id="room1"><h3>🛏️ CAMERA DA LETTO</h3><p>Pulisci lo sporco!</p></div>
  <div class="room" id="room2"><h3>🛁 BAGNO</h3><p>Pulisci lo sporco!</p></div>
  <div id="player">🤵</div>
</div>

<div id="shop">🛏️ Letto Nuovo: 50€ <button onclick="buyBed()">COMPRA</button></div>

<div id="joy">
  <button onclick="move(-22,0)">◀</button>
  <button onclick="move(0,-22)">▲</button>
  <button onclick="move(0,22)">▼</button>
  <button onclick="move(22,0)">▶</button>
</div>

<div id="msg"><h2 id="msgTitle"></h2><p id="msgText" style="margin:10px 0"></p><button onclick="closeMsg()" style="padding:10px 20px;background:#f5c518;border:none;border-radius:10px;font-weight:bold">OK</button></div>

<script>
let x=180,y=180,money=0,sodd=0,day=1,timeLeft=120,bedBought=false;
let player=document.getElementById('player');
function renderPlayer(){ player.style.left=x+'px'; player.style.top=y+'px'; }
renderPlayer();
function move(dx,dy){ x=Math.max(0,Math.min(window.innerWidth-50,x+dx)); y=Math.max(0,Math.min(320,y+dy)); renderPlayer(); checkDirt(); }
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a') move(-22,0);
  if(e.key==='ArrowRight'||e.key==='d') move(22,0);
  if(e.key==='ArrowUp'||e.key==='w') move(0,-22);
  if(e.key==='ArrowDown'||e.key==='s') move(0,22);
});
let dirts=[];
function spawnDirt(){
  document.querySelectorAll('.dirt').forEach(d=>d.remove());
  dirts=[];
  let rooms=[document.getElementById('room1'),document.getElementById('room2')];
  rooms.forEach((room,ri)=>{
    for(let i=0;i<2;i++){
      let d=document.createElement('div'); d.className='dirt'; d.innerHTML='🧹';
      let rx=20+Math.random()*80, ry=60+Math.random()*90;
      d.style.left=rx+'px'; d.style.top=ry+'px';
      d.onclick=()=>clean(d);
      room.appendChild(d); dirts.push(d);
    }
  });
}
function clean(el){
  el.remove(); money+=15; sodd=Math.min(100,sodd+8);
  updateHUD();
  if(Math.random()>0.5) spawnDirt();
  if(sodd>=100){ showMsg('🎉 VILLA PERFETTA!','Sei quasi arrivato! Il proprietario sarà orgoglioso.'); sodd=90; }
}
function checkDirt(){}
function updateHUD(){
  document.getElementById('money').innerText=money+'€';
  document.getElementById('sodd').innerText=sodd+'%';
  document.getElementById('bar').style.width=sodd+'%';
  document.getElementById('day').innerText=day;
}
function buyBed(){
  if(money>=50 && !bedBought){ money-=50; bedBought=true; sodd+=15; updateHUD(); showMsg('🛏️ UPGRADE!','Hai comprato il Letto Nuovo! +15% soddisfazione. La villa cresce!'); }
  else if(bedBought) showMsg('Già comprato','Hai già il letto nuovo bro!');
  else showMsg('Soldi insufficienti','Ti servono 50€. Pulisci ancora un po\'!');
}
function showMsg(t,txt){ document.getElementById('msgTitle').innerText=t; document.getElementById('msgText').innerText=txt; document.getElementById('msg').style.display='block'; }
function closeMsg(){ document.getElementById('msg').style.display='none'; }
setInterval(()=>{
  timeLeft--;
  let m=Math.floor(timeLeft/60), s=String(timeLeft%60).padStart(2,'0');
  document.getElementById('timer').innerText=m+':'+s;
  if(timeLeft<=0){
    day++; timeLeft=120;
    if(day>30){ showMsg('🏆 HAI VINTO!','Dopo 30 giorni la villa è TUA! Ora sei il proprietario di BUTLER TYCOON!'); day=1; sodd=0; money=0; }
    else showMsg('🌙 GIORNO '+day,'Giorno '+ (day-1) +' finito! Soddisfazione: '+sodd+'%. Continua così!');
    updateHUD();
  }
},1000);
spawnDirt(); updateHUD();
</script>
</body>
</html>
